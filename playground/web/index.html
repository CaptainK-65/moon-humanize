<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>moon-humanize Playground</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #203047; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .shell { width: min(720px, 100%); }
    header { margin-bottom: 20px; }
    h1 { margin: 0 0 8px; letter-spacing: -0.03em; }
    .subtitle { margin: 0; color: #718096; }
    .card { background: white; border: 1px solid #e3e8f0; border-radius: 18px; padding: 22px; box-shadow: 0 12px 40px rgba(32, 48, 71, .08); }
    .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; }
    button, input { font: inherit; }
    button { border: 1px solid #d9e0ea; background: #fff; color: #44546a; border-radius: 10px; padding: 9px 13px; cursor: pointer; }
    button.active { background: #315efb; color: white; border-color: #315efb; }
    .lang { margin-left: auto; }
    label { display: block; font-size: 14px; color: #718096; margin-bottom: 8px; }
    input { width: 100%; border: 1px solid #d9e0ea; border-radius: 10px; padding: 13px 14px; color: #203047; outline: none; }
    input:focus { border-color: #315efb; box-shadow: 0 0 0 3px rgba(49, 94, 251, .12); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .result { margin-top: 18px; padding: 18px; border-radius: 12px; background: #eef3ff; color: #2145bb; font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 700; word-break: break-word; }
    .hint { margin: 12px 0 0; color: #8a96a8; font-size: 13px; }
    @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <h1>moon-humanize</h1>
      <p class="subtitle">把机器数据变成人话 · Humanize machine data</p>
    </header>
    <section class="card">
      <div class="toolbar">
        <button class="tab active" data-tab="duration">时长</button>
        <button class="tab" data-tab="bytes">字节</button>
        <button class="tab" data-tab="relative">相对时间</button>
        <button id="lang" class="lang">中文 / EN</button>
      </div>
      <div id="duration-panel" class="panel">
        <label for="duration-input">毫秒 / milliseconds</label>
        <input id="duration-input" type="number" value="3661000" step="1">
      </div>
      <div id="bytes-panel" class="panel" hidden>
        <label for="bytes-input">字节数 / bytes</label>
        <input id="bytes-input" type="number" value="1536000" step="1">
      </div>
      <div id="relative-panel" class="panel" hidden>
        <div class="row">
          <div><label for="timestamp-input">时间戳 / timestamp (ms)</label><input id="timestamp-input" type="number" value="1700000000000" step="1"></div>
          <div><label for="now-input">基准时间 / now (ms)</label><input id="now-input" type="number" value="1700259200000" step="1"></div>
        </div>
      </div>
      <div id="result" class="result" aria-live="polite"></div>
      <p class="hint">输入会实时更新；相对时间基准由输入提供，保证结果可复现。</p>
    </section>
  </main>
  <script type="module">
    import { duration_zh, duration_en, bytes_format, relative_zh, relative_en } from './playground.js';
    let tab = 'duration';
    let english = false;
    const $ = (id) => document.getElementById(id);
    function render() {
      let value;
      if (tab === 'duration') value = english ? duration_en(BigInt($('duration-input').value || 0)) : duration_zh(BigInt($('duration-input').value || 0));
      if (tab === 'bytes') value = bytes_format(BigInt($('bytes-input').value || 0));
      if (tab === 'relative') value = english ? relative_en(BigInt($('timestamp-input').value || 0), BigInt($('now-input').value || 0)) : relative_zh(BigInt($('timestamp-input').value || 0), BigInt($('now-input').value || 0));
      $('result').textContent = value;
    }
    document.querySelectorAll('.tab').forEach((button) => button.addEventListener('click', () => {
      tab = button.dataset.tab;
      document.querySelectorAll('.tab').forEach((item) => item.classList.toggle('active', item === button));
      document.querySelectorAll('.panel').forEach((panel) => panel.hidden = panel.id !== `${tab}-panel`);
      render();
    }));
    $('lang').addEventListener('click', () => { english = !english; render(); });
    document.querySelectorAll('input').forEach((input) => input.addEventListener('input', render));
    render();
  </script>
</body>
</html>
