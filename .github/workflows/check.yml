name: MoonBit checks

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash
          ls -la "$HOME/.moon/bin" || echo "moon bin not found"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.cn/install/powershell.ps1 | iex
          Get-ChildItem "$env:USERPROFILE\.moon\bin" | Select-Object Name

      - name: Check
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            MOON="$USERPROFILE/.moon/bin/moon.exe"
          else
            MOON="$HOME/.moon/bin/moon"
          fi
          "$MOON" check

      - name: Test all targets
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            MOON="$USERPROFILE/.moon/bin/moon.exe"
          else
            MOON="$HOME/.moon/bin/moon"
          fi
          "$MOON" test --target all

      - name: Format check
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            MOON="$USERPROFILE/.moon/bin/moon.exe"
          else
            MOON="$HOME/.moon/bin/moon"
          fi
          "$MOON" fmt --check

      - name: Generate package interfaces
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            MOON="$USERPROFILE/.moon/bin/moon.exe"
          else
            MOON="$HOME/.moon/bin/moon"
          fi
          "$MOON" info
